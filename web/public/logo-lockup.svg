<!-- Standalone export. Opened outside the app, "Poppins" falls back to the nearest system sans-serif
     since web fonts aren't embedded in this file — the in-app <PhoenixLogoLockup> component is the
     canonical usage and always renders with Poppins loaded via index.html. -->
<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoenixGradLockup" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#0F6E6A" />
      <stop offset="55%" stop-color="#2C8FEA" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
  </defs>
  <g transform="translate(0,0)">
    <path
      d="M100,172 C58,172 28,140 28,100 C28,58 54,32 70,12 C67,44 84,56 90,40 C95,62 111,56 116,29 C132,54 152,70 152,106 C152,146 136,172 100,172 Z"
      fill="url(#phoenixGradLockup)"
    />
    <path
      d="M8,100 L58,100 L74,68 L90,134 L106,56 L122,100 L192,100"
      fill="none"
      stroke="#F7FAFA"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
  <text x="212" y="112" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="700" font-size="58" fill="#1E2A32">
    Phoenix<tspan fill="#0F6E6A">Care</tspan>
  </text>
  <text x="214" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" font-size="20" fill="#445866">
    Rise stronger, every day.
  </text>
</svg>
